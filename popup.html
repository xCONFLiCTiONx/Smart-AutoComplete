<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AutoComplete</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <style>
    :root {
      --bg: #08090d;
      --card-bg: #0e1118;
      --card-border: #1a202e;
      --card-border-hover: #263045;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-light: #38bdf8;
      --accent-glow: rgba(14, 165, 233, 0.25);
      --accent-bg: rgba(14, 165, 233, 0.08);
      --accent-border: rgba(14, 165, 233, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --danger-border: rgba(239, 68, 68, 0.3);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --success-border: rgba(16, 185, 129, 0.3);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: rgba(245, 158, 11, 0.3);
    }

    html {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      scrollbar-width: thin;
      scrollbar-color: #263045 #0b0d13;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0b0d13;
    }

    ::-webkit-scrollbar-thumb {
      background: #263045;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    body {
      width: 320px;
      background: var(--bg);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 70%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header matching Settings */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .btn-icon {
      background: #141824;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-icon:hover {
      background: #1c2234;
      border-color: var(--card-border-hover);
      color: #38bdf8;
    }

    .content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Site status card */
    .site-card {
      background: #0b0e14;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .site-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .site-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .site-dot.is-paused {
      background: var(--warning);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }

    .site-domain-box {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .site-domain {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-subtitle {
      font-size: 10px;
      color: var(--text-subtle);
    }

    .site-toggle-btn {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .site-toggle-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .site-toggle-btn.is-paused {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: var(--warning-border);
    }

    /* Buttons matching Settings design system */
    .btn {
      background: #141824;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
      height: 34px;
    }

    .btn:hover {
      background: #1c2234;
      border-color: var(--card-border-hover);
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.25);
      height: 38px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
      transform: translateY(-1px);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Footer */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      font-size: 11px;
      color: var(--text-muted);
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .footer-link:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="icons/icon48.png" alt="Smart AutoComplete" class="brand-icon">
      <span>Smart AutoComplete</span>
    </div>
    <button type="button" class="btn-icon" id="openSettingsTopBtn" title="Open Settings Dashboard">⚙️</button>
  </header>

  <div class="content">
    <div class="site-card" id="siteStatusBar">
      <div class="site-info">
        <span class="site-dot" id="siteDot"></span>
        <div class="site-domain-box">
          <span class="site-domain" id="siteDomain">Checking site...</span>
          <span class="site-subtitle" id="siteSubtitle">Active on this site</span>
        </div>
      </div>
      <button class="site-toggle-btn" id="siteToggleBtn" title="Toggle Smart AutoComplete on this website">
        Active
      </button>
    </div>

    <button type="button" class="btn btn-primary" id="autofillPageBtn">
      <span>⚡</span> AutoFill Page
    </button>

    <div class="btn-grid">
      <button type="button" class="btn" id="openProfileBtn">
        <span>👤</span> Master Profile
      </button>
      <button type="button" class="btn" id="openAddressesBtn">
        <span>📍</span> Addresses
      </button>
    </div>
  </div>

  <footer>
    <a href="#" class="footer-link" id="entriesCountLink" title="View stored entries in Settings">
      <span id="entriesCount">0 saved items</span>
    </a>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="#" class="footer-link" id="openTestSandboxLink" title="Open live test sandbox">🧪 Sandbox</a>
      <a href="#" class="footer-link" id="openOptionsLink">⚙️ Settings</a>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
